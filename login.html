<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — PG Manager</title>
<meta name="theme-color" content="#4F46E5" />
<script>try{var t=localStorage.getItem("pgTheme");if(t){document.documentElement.dataset.theme=t;}}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18v-8'/%3E%3Cpath d='M4 14h16v4'/%3E%3Cpath d='M20 14v-1.5a2 2 0 0 0-2-2h-7V14'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">

<main class="auth">
  <div class="auth-top">
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="auth-card">
    <span class="brand-mark auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-8"/><path d="M4 14h16v4"/><path d="M20 14v-1.5a2 2 0 0 0-2-2h-7V14"/></svg>
    </span>

    <h1>Sign in to PG Manager</h1>
    <p class="auth-sub">Owner access for Sunrise Boys PG</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="userid">User ID</label>
        <input id="userid" name="userid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>

      <p class="auth-error" id="error" role="alert" hidden>Wrong user ID or password. Try again.</p>

      <button class="btn-primary" type="submit">Sign in</button>
    </form>

    <div class="auth-hint">
      <b>Demo access</b>
      <span>User ID <code>admin</code> · Password <code>pass</code></span>
    </div>
  </div>

  <p class="auth-foot">PG Manager · static preview build v0.1</p>
</main>

<script>
  // Preview-only gate. Credentials are checked in the browser, so this is a
  // demo lock, not real security. Replace with a server login before go-live.
  var DEMO_ID = "admin";
  var DEMO_PW = "pass";

  var form = document.getElementById("login-form");
  var error = document.getElementById("error");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = document.getElementById("userid").value.trim();
    var pw = document.getElementById("password").value;

    if (id === DEMO_ID && pw === DEMO_PW) {
      try { sessionStorage.setItem("pgAuth", "ok"); } catch (err) {}
      location.replace("index.html");
    } else {
      error.hidden = false;
      document.getElementById("password").value = "";
      document.getElementById("password").focus();
    }
  });

  form.addEventListener("input", function () { error.hidden = true; });

  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("pgTheme", next); } catch (err) {}
  });
</script>
</body>
</html>
