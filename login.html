<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — PG Manager</title>
<meta name="theme-color" content="#0C0E14" />
<meta name="robots" content="noindex, nofollow" />
<script>try{var t=localStorage.getItem("pgTheme");if(t){document.documentElement.dataset.theme=t;}}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18v-8'/%3E%3Cpath d='M4 14h16v4'/%3E%3Cpath d='M20 14v-1.5a2 2 0 0 0-2-2h-7V14'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body class="auth-body">

<main class="auth">
  <div class="auth-top">
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="auth-card">
    <span class="brand-mark auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-8"/><path d="M4 14h16v4"/><path d="M20 14v-1.5a2 2 0 0 0-2-2h-7V14"/></svg>
    </span>

    <h1>Sign in to PG Manager</h1>
    <p class="auth-sub">Private access for the property owner and staff</p>

    <p class="auth-ok" id="created" role="status" hidden>Account created. Sign in below.</p>
    <p class="auth-note" id="reason" role="status" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="who">Email or username</label>
        <input id="who" name="who" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <span class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required />
          <button class="pw-eye" id="pw-eye" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </div>

      <p class="auth-error" id="error" role="alert" hidden></p>

      <button class="btn-primary" id="submit" type="submit">Sign in</button>
    </form>

    <p class="auth-alt" id="alt">Have an invite code? <a href="signup.html">Create your login</a></p>

    <div class="auth-hint">
      <b>This door is watched</b>
      <span>Wrong guesses slow the login down and then lock it. You are signed out after 30 idle minutes.</span>
    </div>
  </div>

  <p class="auth-foot">PG Manager · build v0.3</p>
</main>

<script>
  // Sign-in runs through auth.js: Supabase when config.js holds project keys,
  // otherwise the hashed browser-local accounts.
  var form = document.getElementById("login-form");
  var error = document.getElementById("error");
  var submit = document.getElementById("submit");
  var who = document.getElementById("who");
  var pass = document.getElementById("password");
  var ticker = null;

  function busy(on) {
    submit.disabled = on;
    submit.textContent = on ? "Checking\u2026" : "Sign in";
  }

  function fail(msg) {
    error.textContent = msg;
    error.hidden = false;
    busy(false);
  }

  /* While a lock is running the button counts itself down, so nobody sits
     there retyping into a form that cannot accept anything yet. */
  function holdFor(ms) {
    if (ticker) { clearInterval(ticker); }
    var until = Date.now() + ms;

    function step() {
      var left = Math.ceil((until - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(ticker);
        ticker = null;
        submit.disabled = false;
        submit.textContent = "Sign in";
        return;
      }
      var mins = Math.floor(left / 60);
      var secs = left % 60;
      submit.textContent = "Locked \u2014 " + (mins ? mins + "m " : "") + secs + "s";
    }

    submit.disabled = true;
    step();
    ticker = setInterval(step, 1000);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (submit.disabled) { return; }

    var id = who.value.trim();
    var pw = pass.value;
    if (!id || !pw) { return fail("Enter your login and password."); }

    busy(true);

    PGAuth.signIn(id, pw).then(function (res) {
      if (res.ok) {
        location.replace("index.html");
        return;
      }
      pass.value = "";
      fail(res.error || "Wrong login or password.");
      if (res.waitMs > 0) { holdFor(res.waitMs); } else { pass.focus(); }
    }, function () {
      fail("Could not sign in right now. Try again.");
    });
  });

  form.addEventListener("input", function () { error.hidden = true; });

  document.getElementById("pw-eye").addEventListener("click", function () {
    var shown = pass.type === "text";
    pass.type = shown ? "password" : "text";
    this.setAttribute("aria-pressed", String(!shown));
    this.setAttribute("aria-label", shown ? "Show password" : "Hide password");
    pass.focus();
  });

  if (/[?&]new=1/.test(location.search)) {
    document.getElementById("created").hidden = false;
  }

  // index.html sends people here with a reason when a session runs out.
  var out = /[?&]out=([a-z]+)/.exec(location.search);
  var REASONS = {
    idle: "You were signed out after 30 minutes of no activity.",
    expired: "That session reached its 12 hour limit. Sign in again.",
    stale: "Your password changed, so every other session was signed out."
  };
  if (out && REASONS[out[1]]) {
    var note = document.getElementById("reason");
    note.textContent = REASONS[out[1]];
    note.hidden = false;
  }

  // Before any account exists, point the first visitor at setting one up.
  PGAuth.needsBootstrap().then(function (first) {
    if (!first) { return; }
    document.getElementById("alt").innerHTML =
      'No account exists yet. <a href="signup.html">Set up the owner login</a>';
  }, function () {});

  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("pgTheme", next); } catch (err) {}
  });
</script>
</body>
</html>
