<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account — PG Manager</title>
<meta name="theme-color" content="#0C0E14" />
<script>try{var t=localStorage.getItem("pgTheme");if(t){document.documentElement.dataset.theme=t;}}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18v-8'/%3E%3Cpath d='M4 14h16v4'/%3E%3Cpath d='M20 14v-1.5a2 2 0 0 0-2-2h-7V14'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body class="auth-body">

<main class="auth">
  <div class="auth-top">
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="auth-card">
    <span class="brand-mark auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18v-8"/><path d="M4 14h16v4"/><path d="M20 14v-1.5a2 2 0 0 0-2-2h-7V14"/></svg>
    </span>

    <h1>Create your account</h1>
    <p class="auth-sub">Set up a login for PG Manager</p>

    <p class="auth-ok" id="confirm-note" role="status" hidden></p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Swayam Kate" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required />
        <p class="hint">You will sign in with this email.</p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required />
        <p class="hint">At least 6 characters.</p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="••••••••" required />
      </div>

      <p class="auth-error" id="error" role="alert" hidden></p>

      <button class="btn-primary" id="submit" type="submit">Create account</button>
    </form>

    <p class="auth-alt">Already have a login? <a href="login.html">Sign in</a></p>

    <div class="auth-hint">
      <b>Accounts</b>
      <span>Stored in Supabase once the project keys are set in <code>config.js</code>.</span>
    </div>
  </div>

  <p class="auth-foot">PG Manager · static preview build v0.1</p>
</main>

<script>
  // Account creation is handled by auth.js: Supabase Auth when config.js is
  // filled in, otherwise the browser-only demo mode.
  var form = document.getElementById("signup-form");
  var error = document.getElementById("error");
  var submit = document.getElementById("submit");
  var note = document.getElementById("confirm-note");

  function busy(on) {
    submit.disabled = on;
    submit.textContent = on ? "Creating…" : "Create account";
  }

  function fail(msg, focusId) {
    error.textContent = msg;
    error.hidden = false;
    busy(false);
    if (focusId) { document.getElementById(focusId).focus(); }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var pw = document.getElementById("password").value;
    var cpw = document.getElementById("confirm").value;

    if (!name) { return fail("Please enter your name.", "name"); }
    if (!PGAuth.isEmail(email)) { return fail("Enter a valid email address.", "email"); }
    if (pw.length < 6) { return fail("Password must be at least 6 characters.", "password"); }
    if (pw !== cpw) { return fail("Passwords do not match.", "confirm"); }

    busy(true);

    PGAuth.signUp(name, email, pw).then(function (res) {
      if (!res.ok) {
        return fail(res.error || "Could not create the account.", "email");
      }
      if (res.needsConfirm) {
        // Supabase is set to confirm email addresses before the first sign-in.
        error.hidden = true;
        form.hidden = true;
        note.textContent = "Almost done — check " + email + " for a confirmation link, then sign in.";
        note.hidden = false;
        return;
      }
      location.replace("login.html?new=1");
    }, function () {
      fail("Could not create the account right now. Try again.", null);
    });
  });

  form.addEventListener("input", function () { error.hidden = true; });

  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("pgTheme", next); } catch (err) {}
  });
</script>
</body>
</html>
